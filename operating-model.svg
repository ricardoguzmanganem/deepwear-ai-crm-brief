    <path d="M0 0 L8 3.5 L0 7 Z" fill="#92cfff"/>
  </marker>
  <marker id="arrowPink" markerWidth="8" markerHeight="6" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0 0 L7 3 L0 6 Z" fill="#E43D75"/>
  </marker>
  <style>
    .t{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .serif{font-family:Georgia,"Times New Roman",serif}
    .title{font-weight:800;fill:#fff}
    .sub{fill:#dbe7ff}
    .small{font-size:12px}
    .tiny{font-size:10px}
    .blueLine{stroke:#92cfff;stroke-width:2;fill:none}
    .pinkLine{stroke:#E43D75;stroke-width:1.6;fill:none;stroke-dasharray:7 7}
  </style>
</defs>

